# Verificação a cada envio: tipos, ícones e compilação.
name: Verificação

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Verificar subconjunto de ícones
        run: npm run icones:verificar

      - name: Compilar
        run: npm run build

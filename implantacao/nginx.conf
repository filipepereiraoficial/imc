# Configuração de produção para a plataforma da OMCL.
#
# Três responsabilidades: servir a aplicação de página única, definir o cache
# corretamente e aplicar os cabeçalhos de segurança que docs/SEGURANCA.md exige.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compressão. Fontes .woff2 já vêm comprimidas — recomprimir só gasta CPU.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # --- Cabeçalhos de segurança ---
    # A CSP pode ser restritiva porque a aplicação não usa CDN algum: fontes,
    # ícones e scripts saem da própria origem.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Ativar apenas quando o domínio servir exclusivamente por HTTPS.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Cache ---
    # Os arquivos de assets têm hash no nome: podem ser eternos e imutáveis.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /fontes/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # O index nunca é cacheado: é ele que aponta para a versão atual dos assets.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- Roteamento da aplicação de página única ---
    # Qualquer caminho desconhecido devolve o index; o roteador do navegador
    # decide o que renderizar. Sem isso, recarregar /feed devolveria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sem listagem de diretório e sem exposição da versão do servidor.
    autoindex off;
    server_tokens off;
}
